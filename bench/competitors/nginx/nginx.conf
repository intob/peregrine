# nginx for bench/scripts/h2-bench.sh, run in peregrine-h3load (nginx 1.30
# with OpenSSL 3.5 and HTTP/3): nginx -c /bench/competitors/nginx/nginx.conf
# with the repository's bench/ mounted at /bench and the 64 KiB file at
# /tmp/www/64k. h2c (prior knowledge) on 8080; TLS 1.3 (h2, http/1.1) and
# HTTP/3 on 8443. "/" answers "Hello, World!" with `return 200`; "/64k" is a
# file, kept open (open_file_cache) and read into buffers (sendfile off,
# nginx's default: one user-space copy, as h2o's pread and peregrine's
# memory body). Like peregrine: a worker pinned to each CPU and an
# SO_REUSEPORT listener each; etag and accept-ranges off, `Server: nginx`.
# keepalive_requests is raised from its default of 1000, which also caps
# requests per h2 connection (h2o and peregrine have no such cap): h2load
# doesn't reconnect, so at 1000 each connection stops after 1000 requests
# (NGINX_KEEPALIVE=default in h2-bench.sh shows it).
worker_processes 6;
worker_cpu_affinity auto;
daemon off;
user root;
pid /tmp/nginx.pid;
error_log stderr error;
events {
    worker_connections 4096;
}
http {
    access_log off;
    default_type text/plain;
    keepalive_requests 10000000;
    open_file_cache max=64 inactive=1h;
    open_file_cache_valid 1h;
    sendfile off;
    etag off;
    max_ranges 0;
    server_tokens off;
    server {
        listen 8080 reuseport;
        http2 on;
        location = / { return 200 "Hello, World!"; }
        location = /64k { alias /tmp/www/64k; }
    }
    server {
        listen 8443 ssl reuseport;
        listen 8443 quic reuseport;
        http2 on;
        http3 on;
        quic_gso on;
        ssl_certificate /bench/cert.pem;
        ssl_certificate_key /bench/key.pem;
        ssl_protocols TLSv1.3;
        location = / { return 200 "Hello, World!"; }
        location = /64k { alias /tmp/www/64k; }
    }
}
