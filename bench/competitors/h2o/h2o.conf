# h2c (prior knowledge) on 8080; TLS 1.3 (h2, http/1.1) and HTTP/3 on 8443.
# "/" is "Hello, World!", "/64k" 64 KiB of 'x', both static files, like
# bench-server's "/" and "/64k". Otherwise defaults (100 streams per
# connection on h2 and h3).
num-threads: 6
error-log: /dev/null
listen: 8080
listen: &tls
  port: 8443
  ssl:
    certificate-file: /bench/cert.pem
    key-file: /bench/key.pem
    minimum-version: TLSv1.3
listen:
  <<: *tls
  type: quic
hosts:
  default:
    paths:
      /64k:
        file.file: /www/64k.txt
      /:
        file.file: /www/hello.txt
    file.mime.addtypes:
      text/plain: .txt
