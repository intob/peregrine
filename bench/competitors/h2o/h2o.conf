# h2c (prior knowledge) on 8080; TLS 1.3 (h2, http/1.1) and HTTP/3 on 8443.
# "/" is "Hello, World!", "/64k" 64 KiB of 'x', both static files (h2o has
# no `return` without mruby). The file handler keeps files open (its fd
# cache, 200 entries by default) and preads every response; it has no
# in-memory cache. Like peregrine: a thread pinned to each of CPUs 0-5 and an
# SO_REUSEPORT listener each; etag and server headers off (last-modified and
# accept-ranges stay). Otherwise defaults (100 streams per connection on h2
# and h3).
num-threads: [0, 1, 2, 3, 4, 5]
tcp-reuseport: ON
send-server-name: OFF
error-log: /dev/null
listen: 8080
listen: &tls
  port: 8443
  ssl:
    certificate-file: /bench/cert.pem
    key-file: /bench/key.pem
    minimum-version: TLSv1.3
listen:
  <<: *tls
  type: quic
file.etag: OFF
hosts:
  default:
    paths:
      /64k:
        file.file: /www/64k.txt
      /:
        file.file: /www/hello.txt
    file.mime.addtypes:
      text/plain: .txt
